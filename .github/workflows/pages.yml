name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'   # weekly refresh of episode data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore wiki cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: fandom-v2-${{ github.run_id }}
          restore-keys: fandom-v2-
      - name: Build data (order from arrowverse.info, details from TVmaze, cast from the Arrowverse wiki)
        run: node scripts/build-data.mjs
        timeout-minutes: 20
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html styles.css manifest.webmanifest sw.js data.json report.json js icons _site/
          [ -f characters.json ] && cp characters.json _site/ || echo 'no characters.json'
          [ -d images ] && cp -r images _site/ || echo 'no images'
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
