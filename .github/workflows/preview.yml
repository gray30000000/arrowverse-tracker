# Test deploy for the character-images branch. GitHub Pages hosts one site per repo, so
# this deploys main's app at the usual address (unchanged) and this branch's app under
# /preview/, both reading the same freshly built data. The next push to main deploys
# without /preview/ again. Delete this file before merging.
name: Preview on GitHub Pages

on:
  push:
    branches: [character-images]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore wiki cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: fandom-v2-${{ github.run_id }}
          restore-keys: fandom-v2-
      - name: Build data with this branch's scripts
        run: node scripts/build-data.mjs
        timeout-minutes: 25
      - name: Assemble site (main at /, this branch at /preview/)
        run: |
          mkdir -p _site/preview
          (cd main-src && cp -r index.html styles.css manifest.webmanifest sw.js js icons ../_site/)
          cp -r index.html styles.css manifest.webmanifest sw.js js icons _site/preview/
          for d in _site _site/preview; do
            cp data.json report.json "$d/"
            [ -f characters.json ] && cp characters.json "$d/" || echo 'no characters.json'
          done
          # Own offline cache names, so the two service workers don't clear each other's caches.
          sed -i "s/shell-/preview-shell-/g" _site/preview/sw.js
          sed -i "s|<title>\(.*\)</title>|<title>\1 (preview)</title>|" _site/preview/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
